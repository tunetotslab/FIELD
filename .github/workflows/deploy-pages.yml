name: Verify Cloudflare Pages build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-verification
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run typecheck && npm test
      - name: Build
        env:
          VITE_FIELD_API_URL: ${{ vars.FIELD_API_URL }}
          VITE_FIELD_WORLD_ENABLED: ${{ vars.FIELD_WORLD_ENABLED }}
          VITE_FIELD_GROUPS_ENABLED: ${{ vars.FIELD_GROUPS_ENABLED }}
        run: npm run build:cloudflare
      - name: Reject production source maps
        run: test -z "$(find dist -type f -name '*.map' -print -quit)"
